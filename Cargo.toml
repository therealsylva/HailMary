[package]
name = "hailmary"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline-first remote systems management for air-gapped networks"
repository = "https://github.com/therealsylva/HailMary"
readme = "README.md"
keywords = ["airgap", "systems-management", "security", "offline"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
aes-gcm = "0.11"
argon2 = "0.5"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
hex = "0.4"
hkdf = "0.13"
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
rand = "0.10"
regex = "1.11"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = "0.23"
rustls-pki-types = { version = "1.15", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1.0"
sha2 = "0.11"
sysinfo = "0.36"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
uuid = { version = "1.16", features = ["serde", "v4"] }
wait-timeout = "0.2"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
